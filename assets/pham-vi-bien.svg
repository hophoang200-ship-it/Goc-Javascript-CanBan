<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Phạm vi hoạt động của biến</title>
  <desc id="desc">Biến var có phạm vi hàm; let và const có phạm vi khối.</desc>
  <rect width="720" height="360" rx="24" fill="#f4f7fa"/>
  <rect x="32" y="32" width="656" height="296" rx="18" fill="#fff" stroke="#0e7c86" stroke-width="4"/>
  <text x="58" y="75" fill="#14233a" font-family="Arial,sans-serif" font-size="25" font-weight="700">Phạm vi hàm</text>
  <text x="58" y="111" fill="#5b6b80" font-family="Arial,sans-serif" font-size="19">var được truy cập trong toàn hàm</text>
  <rect x="196" y="142" width="448" height="150" rx="16" fill="#e5f4f4" stroke="#ffc93c" stroke-width="4"/>
  <text x="220" y="183" fill="#14233a" font-family="Arial,sans-serif" font-size="22" font-weight="700">Phạm vi khối { }</text>
  <text x="220" y="223" fill="#0a5961" font-family="monospace" font-size="20">let ten = "Mai";</text>
  <text x="220" y="260" fill="#0a5961" font-family="monospace" font-size="20">const diem = 9;</text>
  <text x="58" y="200" fill="#14233a" font-family="monospace" font-size="20">var dem = 1;</text>
  <text x="58" y="238" fill="#5b6b80" font-family="Arial,sans-serif" font-size="17">Có thể truy cập</text>
  <circle cx="600" cy="68" r="16" fill="#ffc93c"/>
</svg>
